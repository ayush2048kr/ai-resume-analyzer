name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Next.js Frontend CI (Lint + Production Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (Next.js Build & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Express Backend CI (Dependencies + Syntax Check)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (Express Syntax & Deps Check)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Check Backend Node.js Syntax
        run: node -c server.js
