name: CI/CD — AI Resume Analyzer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend Tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm run test:unit
        env:
          GEMINI_API_KEY: test-key-for-unit-tests

      - name: Run Backend Integration Tests
        run: npm run test:integration
        env:
          GEMINI_API_KEY: test-key-for-integration-tests

      - name: Backend Coverage Report
        run: npm run test:coverage
        env:
          GEMINI_API_KEY: test-key-for-coverage
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 2: Frontend Tests + Build
  # ─────────────────────────────────────────────
  frontend-tests-and-build:
    name: Frontend Tests + Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

  # ─────────────────────────────────────────────
  # Job 3: E2E Tests (only on push to main, not PRs)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
        continue-on-error: true  # E2E can be flaky in CI; don't block deploy

      - name: Upload Playwright Report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: Deploy — only on push to main, all tests pass
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (Vercel + Render)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy Backend to Render
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deploy..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK" | jq '.deploy.status // "triggered"'

      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel --quiet
          vercel --prod --token "$VERCEL_TOKEN" --yes

      - name: Post-Deployment Health Check
        if: env.RENDER_URL != ''
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          echo "Waiting 30s for Render to come up..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/api/health")
          echo "Backend health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check returned $STATUS — backend may still be spinning up"
          else
            echo "Backend is healthy!"
          fi
        continue-on-error: true
